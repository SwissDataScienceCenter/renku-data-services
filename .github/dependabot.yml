version: 2
updates:
- package-ecosystem: "pip"
  directories:
    - "/"
    - "/projects/k8s_watcher"
    - "/projects/renku_data_service"
    - "/projects/renku_data_tasks"
    - "/projects/secrets_storage"
  schedule:
    interval: "weekly"
    day: "sunday"
  open-pull-requests-limit: 5
  groups:
    python:
      applies-to: version-updates
      patterns:
        - "*"
    python-security:
      applies-to: security-updates
      patterns:
        - "*"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "sunday"
  groups:
    actions:
      applies-to: version-updates
      patterns:
        - "*"
    actions-security:
      applies-to: security-updates
      patterns:
        - "*"
- package-ecosystem: "docker"
  directories:
    - "/projects/k8s_watcher"
    - "/projects/renku_data_service"
    - "/projects/renku_data_tasks"
    - "/projects/secrets_storage"
  schedule:
    interval: "weekly"
    day: "sunday"
  groups:
    docker:
      patterns:
        - "*"
