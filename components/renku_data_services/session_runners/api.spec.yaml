openapi: 3.0.2
info:
  title: Renku Data Services API
  description: |
    This service is the main backend for Renku. It provides information about users, projects,
    cloud storage, access to compute resources and many other things.
  version: v1
servers:
  - url: /api/data
paths:
  /session_runners:
    post:
      summary: Create a new session runner
      description: TODO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRunnerPost"
      responses:
        "201":
          description: The session runner was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRunner"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - session_runners
  /session_runners/register:
    post:
      summary: Register a session runner
      description: TODO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRunnerRegisterPost"
      responses:
        "200":
          description: The session runner was registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRunnerRegisterResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - session_runners
components:
  schemas:
    SessionRunner:
      description: A session runner
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        resource_pool_id:
          type: integer
        status:
          $ref: "#/components/schemas/SessionRunnerStatus"
        registration_token:
          type: string
      required:
        - id
        - resource_pool_id
        - status
    SessionRunnerPost:
      description: Data required to create a session runner
      type: object
      additionalProperties: false
      properties:
        resource_pool_id:
          type: integer
      required:
        - resource_pool_id
    SessionRunnerRegisterPost:
      description: Data required to register a session runner
      type: object
      additionalProperties: false
      properties:
        registration_token:
          type: string
      required:
        - registration_token
    SessionRunnerRegisterResponse:
      description: The result of registering a session runner
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
      required:
        - access_token
        - refresh_token
    SessionRunnerStatus:
      description: The status of a session runner
      type: string
      enum:
        - never_contacted
        - initializing
        - ready
        - not_ready
    Ulid:
      description: ULID identifier
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$" # This is case-insensitive
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              minimum: 0
              exclusiveMinimum: true
              example: 1404
            detail:
              type: string
              example: "A more detailed optional message showing what the problem was"
            message:
              type: string
              example: "Something went wrong - please try again later"
            trace_id:
              type: string
              example: "ac93950e9e114a55c67fb8e5ef519bbe"
              description: Sentry trace ID for linking to corresponding log entries
          required: ["code", "message"]
      required: ["error"]
  responses:
    Error:
      description: The schema for all 4xx and 5xx responses
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorResponse"
